<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Panel</title>
</head>
<body>
  <p>
    This sample panel listens for the message broadcast by the other panel when
    you click the <strong>Click Me</strong> button.
  </p>

  <div id="clacker"></div>

  <div style="margin-top: 1rem; border-top: 1px solid var(--omph-border); padding-top: 1rem;">
    <p style="margin-bottom: 0.5rem;">Connected Peers:</p>
    <div id="peer-list" style="font-family: monospace; font-size: 0.9rem; background: var(--omph-bg-mute); padding: 0.5rem; border-radius: var(--omph-radius); border: 1px solid var(--omph-border); min-height: 2rem;">
      <!-- Content dynamically rendered -->
    </div>
  </div>

  <div style="margin-top: 1rem; border-top: 1px solid var(--omph-border); padding-top: 1rem;">
    <p style="margin-bottom: 0.25rem;">Global Click Tracking (Skepsis API):</p>
    <div id="total-clicks" style="font-weight: bold; color: var(--omph-primary); margin-bottom: 0.75rem;"></div>
    <button id="reset-clicks" class="warning" disabled>Reset Lifetime Clicks</button>
  </div>

  <script>
    const output = document.querySelector('#clacker');
    const totalOutput = document.querySelector('#total-clicks');
    const resetBtn = document.querySelector('#reset-clicks');
    const peerList = document.querySelector('#peer-list');

    // -------------------------------------------------------------------------
    // Peer Tracking Logic
    // -------------------------------------------------------------------------
    let peers = {};

    const initPeers = () => {
      peers = {};
      const manifest = omphalos.bundle.omphalos;

      // Pre-populate statically known panels from the manifest
      if (manifest.panels !== undefined) {
        manifest.panels.forEach(p => {
          peers[`panel:${p.name}`] = { type: 'panel', name: p.name, count: 'unknown' };
        });
      }

      // Pre-populate statically known graphics from the manifest
      if (manifest.graphics !== undefined) {
        manifest.graphics.forEach(g => {
          peers[`graphic:${g.name}`] = { type: 'graphic', name: g.name, count: 'unknown' };
        });
      }
    };

    const renderPeers = () => {
      const keys = Object.keys(peers).sort();

      if (keys.length === 0) {
        peerList.innerHTML = '<span style="color: var(--omph-fg-mute); font-style: italic;">No peers detected in manifest.</span>';
        return;
      }

      let html = '';
      keys.forEach(key => {
        const p = peers[key];
        let statusHtml = '';

        if (p.count === 'unknown') {
          statusHtml = `<span style="color: var(--omph-warning);">unknown</span>`;
        } else if (p.count > 0) {
          statusHtml = `<span style="color: var(--omph-success);">${p.count} active</span>`;
        } else {
          statusHtml = `<span style="color: var(--omph-fg-mute);">offline</span>`;
        }

        html += `<div style="margin-bottom: 0.25rem;"><span style="color: var(--omph-primary); font-weight: bold;">[${p.type}]</span> ${p.name}: ${statusHtml}</div>`;
      });

      peerList.innerHTML = html;
    };

    // Initialize and render the static list immediately upon script execution
    initPeers();
    renderPeers();

    // -------------------------------------------------------------------------
    // Network Lifecycle Events
    // -------------------------------------------------------------------------
    omphalos.event.ioConnect(() => {
      omphalos.log.debug('Socket connected and hydrated: enabling reset button');
      resetBtn.disabled = false;

      // The server deliberately does not broadcast a peer connection event to us
      // for our own panel instance. Since we know we are connected, we manually
      // set our count to 1 (unless it is already higher from other instances).
      const selfKey = `${omphalos.asset.type}:${omphalos.asset.name}`;
      if (peers[selfKey] !== undefined) {
        if (peers[selfKey].count === 'unknown' || peers[selfKey].count === 0) {
          peers[selfKey].count = 1;
        }
      }
      renderPeers();
    });

    omphalos.event.ioDisconnect(() => {
      omphalos.log.debug('Socket disconnected: disabling reset button');
      resetBtn.disabled = true;

      // Revert all peers back to 'unknown' since we lost contact with the server
      initPeers();
      renderPeers();
    });

    // -------------------------------------------------------------------------
    // Peer Events
    // -------------------------------------------------------------------------
    omphalos.event.peerConnected((data) => {
      if (peers[`${data.type}:${data.name}`] !== undefined) {
        peers[`${data.type}:${data.name}`].count = data.count;
        renderPeers();
      }
    });

    omphalos.event.peerDisconnected((data) => {
      if (peers[`${data.type}:${data.name}`] !== undefined) {
        peers[`${data.type}:${data.name}`].count = data.count;
        renderPeers();
      }
    });

    // -------------------------------------------------------------------------
    // Standard Events
    // -------------------------------------------------------------------------
    // This example has our own local count for the number of times a clack has
    // occured; this allows us to test that the message passing is working as
    // expected.
    let clackCount = 0;
    omphalos.event.on('clack', () => {
      clackCount++;
      output.innerHTML = `Button clicked ${clackCount} times since panel reload`;
      output.style = 'border-top: 1px solid var(--omph-border); padding-top: 0.5rem;';
    });

    // -------------------------------------------------------------------------
    // Skepsis API
    // -------------------------------------------------------------------------
    // This example uses a Skepsis to show the total number of times that the
    // button has ever been clicked. This one is slightly more reactive; it gets
    // the value of the variable, and updates automagically on change.
    const globalClicks = omphalos.Skepsis('clickCount', 0);

    // Set the initial value on load
    totalOutput.innerHTML = `Lifetime Clicks: ${globalClicks.value}`;

    // Listen for changes from the server or other panels
    globalClicks.on((newValue) => {
      totalOutput.innerHTML = `Lifetime Clicks: ${newValue}`;
    });

    // Test client-side mutation propagating to the server and local listeners
    resetBtn.addEventListener('click', () => {
      globalClicks.value = 0;
    });
  </script>
</body>
</html>
